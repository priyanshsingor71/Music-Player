<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player 🎵 </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="particles"></div>

    <header>

        <h1> 🎶 PN Media Player</h1>

        <div class="top-bar">

            <input type="text" id="search" placeholder="Search songs...">

            <button id="themeBtn">🌙 Dark Mode</button>

            <div class="volume-box">
                🔊
                <input type="range" id="volume" min="0" max="100" value="100">
            </div>

        </div>

    </header>

    <div id="playlist">
        <h2>📃 Playlist</h2>
    </div>

    <div class="container">

        <div class="card">

            <button class="fav-btn">🤍</button>

            <img src="1.png" alt="song">

            <h3 class="song-name">Sheesa </h3>

            <div class="equalizer">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <audio src="1.mp3" controls></audio>

        </div>

        <div class="card">

            <button class="fav-btn">🤍</button>

            <img src="2.png" alt="song">

            <h3 class="song-name">Montegam Alqumanium</h3>

            <div class="equalizer">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <audio src="2.mp3" controls></audio>

        </div>

        <div class="card">

            <button class="fav-btn">🤍</button>

            <img src="3.png" alt="song">

            <h3 class="song-name">Safar </h3>

            <div class="equalizer">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <audio src="3.mp3" controls></audio>

        </div>

        <div class="card">

            <button class="fav-btn">🤍</button>

            <img src="4.png" alt="song">

            <h3 class="song-name">Mera Mann(unplugged)</h3>

            <div class="equalizer">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <audio src="4.mp3" controls></audio>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
